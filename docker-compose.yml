services:
  db:
    image: postgres:18
    container_name: crm_db
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/18/docker
    env_file:
      - .env
    ports:
      - "5432:5432"
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      start_period: 5s

volumes:
  pg_data:
